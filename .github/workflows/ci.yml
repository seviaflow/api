name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: 0.1.x-dev

    steps:
      - uses: actions/checkout@v4
        with:
          path: api
          ref: ${{ github.sha }}

      - uses: actions/checkout@v4
        with:
          repository: seviaflow/core
          ref: 216b30df97d5cbbc4542d609e72d284781f7d0cf
          path: core
          token: ${{ secrets.SEVIAFLOW_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: seviaflow/licensing
          ref: 51c7d3d3f302dfabada1823a7db4f45675da1f3f
          path: licensing
          token: ${{ secrets.SEVIAFLOW_REPO_TOKEN || github.token }}

      - name: Record candidate revisions
        run: |
          for repo in api core licensing; do
            printf '%s=' "$repo"
            git -C "$repo" rev-parse HEAD
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite, pdo_sqlite
          coverage: none

      - name: Validate committed Composer manifest
        working-directory: api
        run: composer validate --strict

      - name: Resolve PHP dependencies with CI-only Core checkout
        working-directory: api
        run: |
          composer config repositories.seviaflow-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"seviaflow/core":"0.1.x-dev"}}}'
          composer config repositories.seviaflow-licensing '{"type":"path","url":"../licensing","options":{"symlink":false,"versions":{"seviaflow/licensing":"0.1.x-dev"}}}'
          composer update --no-interaction --prefer-dist

      - name: PHP quality gates
        working-directory: api
        run: composer check
