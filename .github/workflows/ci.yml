name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
            pest: '^3.7'
            plugin: '^3.2'
          - php: '8.3'
            testbench: '^10.0'
            pest: '^3.7'
            plugin: '^3.2'
          - php: '8.3'
            testbench: '^11.0'
            pest: '^4.4'
            plugin: '^4.1'
    env:
      COMPOSER_ROOT_VERSION: 0.1.x-dev

    steps:
      - uses: actions/checkout@v4
        with:
          path: api
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Check private dependency access
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SEVIAFLOW_REPO_TOKEN: ${{ secrets.SEVIAFLOW_REPO_TOKEN }}
          PRIVATE_DEPENDENCIES: |
            seviaflow/core f8187fda0a6ac52aeac0a6e6ebb079429814c63f
        run: |
          set -euo pipefail
          if [[ -z "$SEVIAFLOW_REPO_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && ( "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || "$GITHUB_ACTOR" == "dependabot[bot]" ) ]]; then
              while read -r repo sha; do
                [[ -n "$repo" ]] || continue
                printf '%s %s limited_scope\n' "$repo" "$sha"
              done <<< "$PRIVATE_DEPENDENCIES"
              echo '::notice title=Private dependency checks limited::Fork and Dependabot pull requests do not receive the repository token.'
            else
              while read -r repo sha; do
                [[ -n "$repo" ]] || continue
                printf '%s %s missing_token\n' "$repo" "$sha"
              done <<< "$PRIVATE_DEPENDENCIES"
              echo '::error title=Missing private dependency token::Configure the SEVIAFLOW_REPO_TOKEN Actions secret before checking private dependencies.'
            fi
            exit 1
          fi

          failed=0
          while read -r repo sha; do
            [[ -n "$repo" ]] || continue
            if status_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $SEVIAFLOW_REPO_TOKEN" "https://api.github.com/repos/$repo/commits/$sha" 2>/dev/null)"; then
              if [[ "$status_code" == "200" ]]; then
                result=pass
              else
                result=access_or_revision_failure
                failed=1
              fi
            else
              result=access_or_revision_failure
              failed=1
            fi
            printf '%s %s %s\n' "$repo" "$sha" "$result"
          done <<< "$PRIVATE_DEPENDENCIES"

          if (( failed != 0 )); then
            echo '::error title=Private dependency access failed::A required repository or exact revision is not accessible with SEVIAFLOW_REPO_TOKEN.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: seviaflow/core
          ref: f8187fda0a6ac52aeac0a6e6ebb079429814c63f
          path: core
          token: ${{ secrets.SEVIAFLOW_REPO_TOKEN }}

      - name: Record candidate revisions
        run: |
          for repo in api core; do
            printf '%s=' "$repo"
            git -C "$repo" rev-parse HEAD
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite, pdo_sqlite
          coverage: none

      - name: Validate committed Composer manifest
        working-directory: api
        run: composer validate --strict

      - name: Select Laravel test compatibility target
        working-directory: api
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.plugin }}"

      - name: Resolve PHP dependencies with CI-only Core checkout
        working-directory: api
        run: |
          composer config repositories.seviaflow-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"seviaflow/core":"0.1.x-dev"}}}'
          composer update --no-interaction --prefer-dist

      - name: PHP quality gates
        working-directory: api
        run: composer check
