name: Private Composer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release without or with a leading v
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: seviaflow/api
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      HUB_UPLOAD_URL: ${{ secrets.SEVIAFLOW_HUB_UPLOAD_URL }}
      HUB_UPLOAD_USERNAME: ${{ secrets.SEVIAFLOW_HUB_UPLOAD_USERNAME }}
      HUB_UPLOAD_PASSWORD: ${{ secrets.SEVIAFLOW_HUB_UPLOAD_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate tag and manifest
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          composer validate --strict
          jq -e --arg version "$version" 'select(.name == "seviaflow/api") | .version = $version' composer.json >/dev/null

      - name: Build clean release archive
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          mkdir -p build
          mkdir -p build/package
          git archive --format=tar "$GITHUB_SHA" | tar -x -C build/package
          jq --arg version "$version" '.version = $version' composer.json > build/package/composer.json
          (cd build/package && zip -qr "$GITHUB_WORKSPACE/seviaflow-api-$version.zip" .)
          sha256sum "$GITHUB_WORKSPACE/seviaflow-api-$version.zip"
          scripts/build-release-manifest.sh composer.json "$version" build/composer-manifest.json

      - name: Upload immutable release draft to Hub
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          version="${VERSION#v}"
          archive="$GITHUB_WORKSPACE/seviaflow-api-$version.zip"
          manifest="$(cat build/composer-manifest.json)"
          hash="$(sha256sum "$archive" | cut -d' ' -f1)"
          dependency_set_hash="$(scripts/release-dependency-set-hash.sh build/composer-manifest.json)"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          checks="$(jq -cn --arg source "$GITHUB_SHA" --arg artifact "$hash" --arg dependencies "$dependency_set_hash" --arg completed "$completed_at" '[{"name":"manifest-validated","conclusion":"success","source_revision":$source,"artifact_hash":$artifact,"dependency_set_hash":$dependencies,"completed_at":$completed},{"name":"artifact-built","conclusion":"success","source_revision":$source,"artifact_hash":$artifact,"dependency_set_hash":$dependencies,"completed_at":$completed}]')"
          curl --fail-with-body --silent --show-error --retry 2 \
            --user "$HUB_UPLOAD_USERNAME:$HUB_UPLOAD_PASSWORD" \
            -F "package_name=$PACKAGE_NAME" \
            -F "version=$version" \
            -F 'channel=stable' \
            -F "reference=$GITHUB_SHA" \
            -F "artifact_hash=$hash" \
            -F "dependency_set_hash=$dependency_set_hash" \
            -F "checks=$checks" \
            -F "composer_manifest=$manifest" \
            -F "artifact=@$archive;type=application/zip" \
            "$HUB_UPLOAD_URL"
